name: Build Loop Bridge APK (preserve existing app data)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: loop-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Loop APK with the original debug signing key
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout current Loop source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android will refuse an in-place upgrade if GitHub signs it with a
      # different key. Refuse to build until the ORIGINAL PC debug.keystore
      # has been placed in the encrypted GitHub Actions repository secret.
      - name: Restore the installed app's original signing key
        env:
          ORIGINAL_KEYSTORE_B64: ${{ secrets.LOOP_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$ORIGINAL_KEYSTORE_B64" ]; then
            echo "::error::Set LOOP_DEBUG_KEYSTORE_BASE64 to the Base64 contents of the ORIGINAL laptop's ~/.android/debug.keystore before building. Never commit the keystore."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          chmod 700 "$HOME/.android"
          printf '%s' "$ORIGINAL_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          test -s "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed debug APK on GitHub
        run: |
          chmod +x gradlew
          ./gradlew :uhabits-android:assembleDebug --no-daemon --max-workers=2 --stacktrace -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Verify APK was produced
        shell: bash
        run: |
          set -euo pipefail
          APK="uhabits-android/build/outputs/apk/debug/uhabits-android-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" "$RUNNER_TEMP/Loop-Bridge-signed-debug.apk"

      - name: Store signed APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Loop-Bridge-signed-debug
          path: ${{ runner.temp }}/Loop-Bridge-signed-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK (without ZIP)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "loop-bridge-build-${GITHUB_RUN_NUMBER}" \
            "$RUNNER_TEMP/Loop-Bridge-signed-debug.apk" \
            --title "Loop Bridge: signed APK build ${GITHUB_RUN_NUMBER}" \
            --notes "Built from the dev branch with the original debug signing keystore stored as an encrypted GitHub Actions secret. Installs OVER the existing org.isoron.uhabits.dev app only if that key matches. Do NOT uninstall Loop or clear its data." \
            --prerelease --latest=false
